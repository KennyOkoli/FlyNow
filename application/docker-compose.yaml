services:
  frontend:
      build: ./web
      ports:
        - "3000:80"
      environment:
        ENDPOINT: http://backend:8000
      depends_on:
        - backend

  backend:
      build: ./server
      # env_file:
      # - path: ./server/.env
      #   required: false
      environment:
        # The same variable names the ECS task definition passes.
        USE_MOCK: false
        SABRE_USER_ID: V1:j5wo3fibee9oowp3:DEVCENTER:EXT
        SABRE_PASSWORD: Gyd2E0Lk
        SABRE_PCC: S5OM
        SABRE_BASE_URL: https://api.cert.platform.sabre.com
        DB_HOST: db
        DB_PORT: "3306"
        DB_NAME: flynow_db_local
        DB_USERNAME: flynow
        DB_PASSWORD: ${LOCAL_DB_PASSWORD:-flynow-local}
      ports:
        - "8000:8000"
      depends_on:
        db:
          condition: service_healthy

    # Stands in for RDS (MySQL 8.4, same as Terraform). Local throwaway data only.
  db:
      image: mysql:8.4
      environment:
        MYSQL_DATABASE: flynow_db_local
        MYSQL_USER: flynow
        MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-flynow-local}
        MYSQL_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-flynow-local-root}
      ports:
        - "3306:3306"
      healthcheck:
        test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
        interval: 5s
        timeout: 5s
        retries: 20




