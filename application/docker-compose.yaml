# Local copy of the AWS setup: nginx frontend -> FastAPI backend -> MySQL.
# Sabre credentials come from server/.env (copy server/.env.example). Nothing secret lives in this file.
#   docker compose up --build    then open http://localhost:3000
services:
  frontend:
    build: ./web
    ports:
      - "3000:80"
    environment:
      ENDPOINT: http://backend:8000
    depends_on:
      - backend

  backend:
    build: ./server
    env_file:
      - path: ./server/.env
        required: false
    environment:
      # The same variable names the ECS task definition passes.
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: flynow_db_local
      DB_USERNAME: flynow
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-flynow-local}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Stands in for RDS (MySQL 8.4, same as Terraform). Local throwaway data only.
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: flynow_db_local
      MYSQL_USER: flynow
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-flynow-local}
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-flynow-local-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
