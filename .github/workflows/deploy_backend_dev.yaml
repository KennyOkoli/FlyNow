name: Deploy backend image
on:
  push:
    branches:
      - dev
    paths:
      - "application/server/**"

permissions:
  id-token: write
  contents: read

defaults:
  run:
   working-directory: application/server

jobs:
  build_and_test:
    environment: dev-app
    runs-on: ubuntu-latest
    steps:
      - name: Pull branch
        uses: actions/checkout@v4

      - name: build-image
        run: docker build -t backend .

      - name: build-test
        run: |
             docker run -d --name flynow-debug -p 8080:8000 \
             -e SABRE_CLIENT_SECRET="${{secrets.SABRE_CLIENT_SECRET}}" \
             -e SABRE_CLIENT_ID=${{vars.SABRE_CLIENT_ID}} \
             -e SABRE_PCC=${{vars.SABRE_PCC}} \
             -e SABRE_BASE_URL=${{vars.SABRE_BASE_URL}} \
             -e USE_MOCK=${{vars.USE_MOCK}} \
             -e SABRE_BASE_URL=${{vars.SABRE_BASE_URL}} \
             -e SABRE_PASSWORD=${{secrets.SABRE_PASSWORD}} \
             -e DB_PASSWORD=${{secrets.DB_PASSWORD}} \
             -e DB_USERNAME=${{vars.DB_USERNAME}} \
             -e DB_NAME=${{vars.DB_NAME}} \
             -e DB_PORT=${{vars.DB_PORT}} \
             -e DB_HOST=${{vars.DB_HOST}} \
             backend

             sleep 3
             docker ps -a
             docker logs flynow-debug

      - name:  test
        run: |
              sleep 6
              curl --fail http://localhost:8080

