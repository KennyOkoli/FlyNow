name: Deploy frontend task

on:
  push:
    branches:
      - dev
    paths:
      - "application/web/**"

defaults:
  run:
    working-directory: application/web

permissions:
  id-token: write
  contents: read

jobs:
    test_image:
      runs-on: ubuntu-latest
      steps:
        - name: pull repo
          uses: actions/checkout@v4

        - name: build_image
          run: |
               docker build -t frontend .
               docker run -d -p 8000:80 -e ENDPOINT=http://localhost:3000 frontend

        - name: test_container
          run: |
               sleep 10
               curl -f http://localhost:8000

    authenticate_push:
      runs-on: ubuntu-latest
      environment: dev-frontend
      steps:
        - name: get-aws-credentials
          uses: aws-actions:configure-aws-credentials@v4
          with:
             role-to-assume: ${{vars.AWS_ROLE}}
             aws-region: ${{vars.AWS_REGION}}